[language-server.roslyn-language-server]
command = "roslyn-language-server"
args = ["--stdio", "--autoLoadProjects"]

[[language]]
name = "c-sharp"
language-servers = ["roslyn-language-server"]
file-types = ["cs", "csproj", "sln"]
auto-format = false
# formatter = {command = "dotnet", args = ["format"]}

[language-server]
veridian = { command = "veridian", args = [] }

[[language]]
name = "hjson"
scope = "source.hjson"
file-types = ["hjson"]
roots=[]

[[grammar]]
name="hjson"
source={git="https://github.com/winston0410/tree-sitter-hjson", rev="02fa3b79b3ff9a296066da6277adfc3f26cbc9e0"}

[language-server.bash-language-server]
timeout=1

[[language]]
name = "json"
formatter = { command = "jq" }

[[language]]
name = "xml"
formatter = { command = "xmllint", args = ["--format", "-"] }

[[language]]
name = "python"
formatter = { command = "ruff", args = ["format", "--line-length", "88", "-"] }
language-servers = [ "pyright" ]

[language-server.tinymist]
command = "tinymist"
config.preview.background.enabled = true
config.preview.background.args = [
  "--data-plane-host=127.0.0.1:0", "--invert-colors=never", "--open"]

[[language]]
name = "Renode repl"
scope = "source.repl"
comment-tokens = ['//']
file-types = ["repl"]

[[language]]
name = "rust"

[language-server.rust-analyzer.config]
procMacro = { enable = true }
cargo = { loadOutDirsFromCheck = true }

# [[language]]
# name = "verilog"
# scope = "source.verilog"
# file-types = ["v", "vh", "sv", "svh"]
# comment-token = "//"
# block-comment-tokens = { start = "/*", end = "*/" }
# language-servers = [ "veridian" ]
# indent = { tab-width = 2, unit = "  " }
# injection-regex = "verilog"

[[language]]
name = "systemverilog"
scope = "source.systemverilog"
file-types = ["v", "vh", "sv", "svh"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 2, unit = "  " }
# language-servers = ["verible-verilog-ls"]
language-servers = [ "veridian" ]

[[grammar]]
name = "systemverilog"
source = { git = "https://github.com/gmlarumbe/tree-sitter-systemverilog", rev = "3bd2c5d2f60ed7b07c2177b34e2976ad9a87c659" }

[[language]]
name = "markdown"
language-servers = ["mdpls"]

[language-server.mdpls]
command = "mdpls"
config = { markdown.preview.auto = false }
